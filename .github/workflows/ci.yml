name: PureWav CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  windows:
    name: Windows (PyInstaller)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set build timestamp
        id: ts
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -like 'v*') {
            $stamp = $env:GITHUB_REF_NAME.Substring(1) -replace '\.', '-'
          } else {
            $stamp = Get-Date -Format 'yyyy-MM-dd-HHmm'
          }
          "stamp=$stamp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/setup-python@v6
        with:
          python-version: "3.8"

      - run: pip install -r requirements.txt soundfile

      - name: Write version.py
        shell: pwsh
        run: |
          $ver = '${{ steps.ts.outputs.stamp }}'
          "VERSION = `"$ver`"" | Out-File -FilePath version.py -Encoding utf8

      - shell: pwsh
        run: |
          pyinstaller --clean `
            --name "PureWav" `
            --onefile `
            --noconsole `
            --icon="audio_icon.ico" `
            --add-data "audio_icon.ico;." `
            --add-data "v6_erb_skip_proj_batch.onnx;." `
            --add-data "ffmpeg.exe;." `
            --hidden-import=onnxruntime.capi._pybind_state `
            --hidden-import=onnxruntime.capi.onnxruntime_pybind11_state `
            main.py

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: PureWav-Windows-x64-${{ steps.ts.outputs.stamp }}
          path: dist/PureWav.exe
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7.0.0
        with:
          path: artifacts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          files=$(find . -type f | sort | tr '\n' ' ')
          gh release create -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" \
            --title "PureWav ${GITHUB_REF_NAME}" \
            --notes "自动发布：tag ${GITHUB_REF_NAME} 对应的 CI 构建产物。" \
            $files
